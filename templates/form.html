<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Bus Fleet Manager</title>
<link href="https://fonts.googleapis.com/css2?family=Source+Code+Pro:wght@400;600&family=Barlow:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
        --bg:       #dce0e3;
        --panel:    #c8cdd1;
        --group-bg: #d4d8db;
        --border:   #9aa0a6;
        --dark:     #2b3036;
        --accent:   #1a5fa8;
        --text:     #1e2428;
        --muted:    #596068;
        --white:    #f5f7f8;
        --grid-hdr: #3a4750;
        --grid-row: #eaecee;
        --grid-alt: #dde0e3;
        --good:     #2e7d32;
        --bad:      #c62828;
    }
    body {
        font-family: 'Barlow', sans-serif;
        background: var(--bg);
        color: var(--text);
        height: 100vh;
        display: flex;
        flex-direction: column;
        overflow: hidden;
    }
    .topbar {
        background: var(--dark);
        color: var(--white);
        padding: 8px 18px;
        font-size: 11px;
        font-family: 'Source Code Pro', monospace;
        letter-spacing: 0.08em;
        display: flex;
        align-items: center;
        gap: 12px;
        flex-shrink: 0;
    }
    .dot { width: 8px; height: 8px; border-radius: 50%; }
    .dot.r { background: #e84c3d; }
    .dot.g { background: #27ae60; }
    .dot.b { background: var(--accent); }
    .topbar-title { flex: 1; text-align: center; font-weight: 600; opacity: 0.8; }
    .layout {
        display: flex;
        flex: 1;
        overflow: hidden;
        padding: 14px;
        gap: 14px;
    }
    .sidebar {
        width: 265px;
        flex-shrink: 0;
        display: flex;
        flex-direction: column;
        gap: 12px;
    }
    .group-box {
        background: var(--group-bg);
        border: 1px solid var(--border);
        border-radius: 2px;
        position: relative;
        padding: 24px 16px 16px;
    }
    .group-box .legend {
        position: absolute;
        top: -10px; left: 12px;
        background: var(--group-bg);
        padding: 0 6px;
        font-size: 10px;
        font-weight: 700;
        letter-spacing: 0.1em;
        text-transform: uppercase;
        color: var(--muted);
        border: 1px solid var(--border);
        border-radius: 2px;
    }
    .field { margin-bottom: 12px; }
    .field:last-child { margin-bottom: 0; }
    .field label {
        display: block;
        font-size: 10px;
        font-weight: 700;
        letter-spacing: 0.07em;
        text-transform: uppercase;
        color: var(--muted);
        margin-bottom: 4px;
    }
    .field select, .field input[type="number"] {
        width: 100%;
        padding: 6px 8px;
        font-family: 'Barlow', sans-serif;
        font-size: 13px;
        background: var(--white);
        border: 1px solid var(--border);
        border-radius: 2px;
        color: var(--text);
        appearance: none;
        outline: none;
        transition: border-color 0.15s;
    }
    .field select:focus, .field input:focus {
        border-color: var(--accent);
        box-shadow: 0 0 0 2px rgba(26,95,168,0.15);
    }
    .inline-pair { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .checkbox-field {
        display: flex;
        align-items: center;
        gap: 7px;
        margin-bottom: 10px;
    }
    .checkbox-field:last-of-type { margin-bottom: 12px; }
    .checkbox-field input[type="checkbox"] {
        width: 15px;
        height: 15px;
        accent-color: var(--accent);
        cursor: pointer;
        flex-shrink: 0;
    }
    .checkbox-field label {
        font-size: 10px;
        font-weight: 700;
        letter-spacing: 0.05em;
        text-transform: uppercase;
        color: var(--muted);
        cursor: pointer;
        margin: 0;
    }
    .btn-enter {
        display: block;
        margin: 14px auto 0;
        padding: 7px 28px;
        background: var(--accent);
        color: white;
        border: none;
        border-radius: 2px;
        font-family: 'Barlow', sans-serif;
        font-size: 11px;
        font-weight: 700;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        cursor: pointer;
        transition: background 0.15s;
    }
    .btn-enter:hover { background: #154e8e; }
    .main {
        flex: 1;
        display: flex;
        flex-direction: column;
        min-width: 0;
    }
    .bus-header {
        display: flex;
        align-items: baseline;
        gap: 14px;
        padding: 0 4px 10px;
        border-bottom: 2px solid var(--border);
        margin-bottom: 10px;
        flex-shrink: 0;
    }
    .bus-name {
        font-size: 24px;
        font-weight: 700;
        letter-spacing: -0.01em;
        color: var(--dark);
    }
    .bus-meta {
        font-size: 10px;
        font-family: 'Source Code Pro', monospace;
        color: var(--muted);
        letter-spacing: 0.06em;
    }
    .grid-wrapper {
        flex: 1;
        overflow: auto;
        border: 1px solid var(--border);
        border-radius: 2px;
        background: var(--white);
    }
    table { width: 100%; border-collapse: collapse; }
    thead th {
        background: var(--grid-hdr);
        color: #cdd5db;
        font-size: 10px;
        font-weight: 700;
        letter-spacing: 0.1em;
        text-transform: uppercase;
        padding: 9px 10px;
        text-align: left;
        position: sticky;
        top: 0;
        white-space: nowrap;
        border-right: 1px solid rgba(255,255,255,0.07);
    }
    tbody tr:nth-child(even) { background: var(--grid-alt); }
    tbody tr:nth-child(odd)  { background: var(--grid-row); }
    tbody tr:hover           { background: #c5daf5; }
    tbody td {
        padding: 7px 10px;
        border-right: 1px solid rgba(0,0,0,0.06);
        border-bottom: 1px solid rgba(0,0,0,0.05);
        white-space: nowrap;
        font-family: 'Source Code Pro', monospace;
        font-size: 12px;
    }
    td.good { color: var(--good); font-weight: 600; }
    td.bad  { color: var(--bad);  font-weight: 600; }
    .empty-state {
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 60px;
        color: var(--muted);
        font-family: 'Source Code Pro', monospace;
        font-size: 12px;
        letter-spacing: 0.05em;
    }
    .footer {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 10px 4px 0;
        flex-shrink: 0;
    }
    .btn-nav {
        padding: 6px 20px;
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 2px;
        font-family: 'Barlow', sans-serif;
        font-size: 11px;
        font-weight: 700;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        cursor: pointer;
        color: var(--dark);
        transition: background 0.1s;
    }
    .btn-nav:hover:not(:disabled) { background: #bcc2c8; }
    .btn-nav:disabled { opacity: 0.35; cursor: default; }
    .status-bar {
        font-size: 11px;
        font-family: 'Source Code Pro', monospace;
        color: var(--muted);
    }

    /* ── SIDEBAR TABS ── */
    .sidebar-tabs { display:flex; gap:0; margin-bottom:12px; border-bottom:2px solid var(--border); }
    .sidebar-tab { flex:1; padding:6px 0; font-family:'Barlow',sans-serif; font-size:10px; font-weight:700; letter-spacing:.1em; text-transform:uppercase; border:1px solid var(--border); border-bottom:none; background:var(--panel); color:var(--muted); cursor:pointer; text-align:center; transition:all .12s; border-radius:2px 2px 0 0; }
    .sidebar-tab.active { background:var(--white); color:var(--accent); }
    .sidebar-tab:hover:not(.active) { background:#bcc2c8; }
    .sidebar-pane { display:none; flex-direction:column; gap:12px; }
    .sidebar-pane.active { display:flex; }

    /* ── SERVICE TAB ── */
    .service-cards { display:flex; flex-direction:column; gap:8px; }
    .service-category { display:flex; flex-direction:column; gap:6px; }
    .service-category + .service-category { margin-top:12px; }
    .service-category-title { display:flex; align-items:center; gap:7px; font-size:10px; font-weight:700; letter-spacing:.1em; text-transform:uppercase; color:var(--muted); }
    .service-category-title::before { content:''; width:7px; height:7px; border-radius:50%; background:var(--border); }
    .service-category-urgent .service-category-title { color:var(--bad); }
    .service-category-urgent .service-category-title::before { background:var(--bad); }
    .service-category-upcoming .service-category-title { color:#e65100; }
    .service-category-upcoming .service-category-title::before { background:#e65100; }
    .service-category-fine .service-category-title { color:var(--good); }
    .service-category-fine .service-category-title::before { background:var(--good); }
    .service-card { background:var(--white); border:1px solid var(--border); border-left:4px solid var(--border); border-radius:2px; padding:10px 12px; }
    .service-card.card-urgent { border-left-color:var(--bad); }
    .service-card.card-upcoming { border-left-color:#e65100; }
    .service-card.card-fine { border-left-color:var(--good); }
    .service-card.card-empty { border-left-color:var(--muted); }
    .service-card-header { display:flex; justify-content:space-between; align-items:center; gap:8px; margin-bottom:7px; }
    .service-card-bus { font-size:14px; font-weight:700; color:var(--dark); }
    .service-card-category { font-size:9px; font-weight:700; letter-spacing:.08em; text-transform:uppercase; }
    .card-urgent .service-card-category { color:var(--bad); }
    .card-upcoming .service-card-category { color:#e65100; }
    .card-fine .service-card-category { color:var(--good); }
    .card-empty .service-card-category { color:var(--muted); }
    .service-card-row { display:flex; justify-content:space-between; gap:8px; font-size:10px; color:var(--muted); }
    .service-card-value { font-family:'Source Code Pro',monospace; font-size:11px; font-weight:600; color:var(--text); text-align:right; }
    .service-main-view { display:none; flex-direction:column; flex:1; min-height:0; }
    .service-main-view.active { display:flex; }
    .service-main-header { display:flex; align-items:baseline; justify-content:space-between; gap:14px; padding:0 4px 10px; border-bottom:2px solid var(--border); margin-bottom:10px; flex-shrink:0; }
    .service-main-title { font-size:24px; font-weight:700; color:var(--dark); }
    .service-main-meta { font-size:10px; font-family:'Source Code Pro',monospace; color:var(--muted); letter-spacing:.06em; }
    .service-main-scroll { flex:1; overflow:auto; border:1px solid var(--border); border-radius:2px; background:var(--group-bg); padding:16px; }
    .service-main-cards { display:grid; grid-template-columns:repeat(3, minmax(240px, 1fr)); align-items:start; gap:18px; }
    .service-main-cards .service-category { display:flex; flex-direction:column; gap:6px; }
    .service-main-cards .service-category + .service-category { margin-top:0; }
    .service-main-cards .service-category-title { font-size:11px; margin-bottom:2px; }
    .service-main-cards .service-card { padding:14px 16px; }
    .service-main-cards .service-card-bus { font-size:16px; }
    .service-main-cards .service-card-row { font-size:11px; }
    .service-main-cards .service-card-value { font-size:12px; }
</style>
</head>
<body>



<div class="layout">

    <!-- LEFT SIDEBAR -->
    <div class="sidebar">

        <div class="sidebar-tabs">
            <button class="sidebar-tab active" onclick="switchSidebarTab('entry', this)">Entry</button>
            <button class="sidebar-tab" onclick="switchSidebarTab('service', this)">Service</button>
        </div>

        <!-- ── ENTRY PANE ── -->
        <div id="pane-entry" class="sidebar-pane active">

        <div class="group-box">
            <div class="legend">Bus Details</div>

            <div class="field">
                <label>Select Seater</label>
                <select id="seaterSelect">
                    <option value="">--- Select Seater ---</option>
                </select>
            </div>

            <div class="field">
                <label>Select Bus</label>
                <select id="busSelect">
                    <option value="">--- Select Bus ---</option>
                </select>
            </div>

            <div class="field">
                <label>Select Driver</label>
                <select id="driverSelect">
                    <option value="">--- Select Driver ---</option>
                </select>
            </div>
        </div>

        <div class="group-box">
            <div class="legend">Distance Details</div>

            <div id="startOdometerField" class="field" style="display:none">
                <label>Starting Odometer <span style="color:#c62828;font-size:9px">★ FIRST ENTRY</span></label>
                <input type="number" id="txtStartOdometer" placeholder="km at trip start">
            </div>

            <div class="inline-pair">
                <div class="field">
                    <label>Current Odometer</label>
                    <input type="number" id="txtOdometer" placeholder="km">
                </div>
                <div class="field">
                    <label>Fuel Used</label>
                    <input type="number" id="txtFuel" placeholder="L">
                </div>
            </div>

            <div class="field">
                <label>Select Tank</label>
                <select id="tankSelect">
                    <option value="">--- Select Tank ---</option>
                </select>
            </div>

            <button class="btn-enter" onclick="submitEntry()">Enter</button>
        </div>

        <div class="group-box">
            <div class="legend">Refuel Tank</div>

            <div class="field">
                <label>Select Tank</label>
                <select id="refuelTankSelect">
                    <option value="">--- Select Tank ---</option>
                </select>
            </div>

            <div class="field">
                <label>Fuel Refuelled</label>
                <input type="number" id="txtRefuelAmount" placeholder="L">
            </div>

            <div class="checkbox-field">
                <input type="checkbox" id="chkFillSelected">
                <label for="chkFillSelected">Fill selected tank to full</label>
            </div>

            <div class="checkbox-field">
                <input type="checkbox" id="chkFillAll">
                <label for="chkFillAll">Fill all tanks to full</label>
            </div>

            <button class="btn-enter" onclick="submitRefuel()">Refuel</button>
        </div>

        </div><!-- /pane-entry -->

        <!-- ── SERVICE PANE ── -->
        <div id="pane-service" class="sidebar-pane">
        </div><!-- /pane-service -->

    </div>

    <!-- MAIN AREA -->
    <div class="main">

        <div id="recordsView" class="main">
        <div class="bus-header">
            <div class="bus-name" id="busName">All Buses</div>
            <div class="bus-meta" id="busMeta">SELECT A BUS TO VIEW RECORDS</div>
        </div>

        <div class="grid-wrapper">
            <table>
                <thead>
                    <tr>
                        <th>Driver</th>
                        <th>Date</th>
                        <th>Prev Odometer</th>
                        <th>Curr Odometer</th>
                        <th>Total KM</th>
                        <th>Diesel (L)</th>
                        <th>KM/L</th>
                        <th>Average</th>
                        <th>Driver Avg</th>
                    </tr>
                </thead>
                <tbody id="gridBody">
                    <tr><td colspan="10"><div class="empty-state">Select a bus to load records</div></td></tr>
                </tbody>
            </table>
        </div>

        <div class="footer">
            <button class="btn-nav" id="btnPrevious" onclick="navigate(-1)" disabled>&#9664; Previous</button>
            <div class="status-bar" id="statusBar">—</div>
            <button class="btn-nav" id="btnNext" onclick="navigate(1)" disabled>Next &#9654;</button>
        </div>
    </div>

    <div id="serviceMainView" class="service-main-view">
            <div class="service-main-header">
                <div class="service-main-title">Service Schedule</div>
                <div class="service-main-meta">NEXT SERVICE BY BUS</div>
            </div>
            <div class="service-main-scroll">
                <div id="serviceCards" class="service-cards service-main-cards">
                    <div class="empty-state">Loading service cards...</div>
                </div>
            </div>
        </div>

    </div>
</div>

<script>
    let allBuses = [];
    let currentBusIndex = -1;
    let lastKnownOdometer = NaN;

    // Load seaters
    fetch('/seaters')
        .then(r => {
            if (!r.ok) throw new Error('GET /seaters returned ' + r.status);
            return r.json();
        })
        .then(data => {
            const sel = document.getElementById('seaterSelect');
            data.forEach(seater => {
                const opt = document.createElement('option');
                opt.value = seater;
                opt.textContent = seater;
                sel.appendChild(opt);
            });
        })
        .catch(err => {
            setStatus('ERROR loading seaters: ' + err.message);
            console.error(err);
        });

    // Load buses
    // Seater selection → repopulate bus dropdown
    document.getElementById('seaterSelect').addEventListener('change', function () {
        const seater = this.value;
        const busSelect = document.getElementById('busSelect');

        // Clear bus dropdown
        busSelect.innerHTML = '<option value="">--- Select Bus ---</option>';
        allBuses = [];
        currentBusIndex = -1;
        document.getElementById('busSelect').value = '';
        document.getElementById('driverSelect').value = '';
        clearGrid();
        updateNavButtons();

        if (!seater) return;

        fetch(`/buses-by-seater/${encodeURIComponent(seater)}`)
            .then(r => {
                if (!r.ok) throw new Error('GET /buses-by-seater returned ' + r.status);
                return r.json();
            })
            .then(data => {
                allBuses = data;
                data.forEach(bus => {
                    const opt = document.createElement('option');
                    opt.value = bus;
                    opt.textContent = bus;
                    busSelect.appendChild(opt);
                });
                setStatus(`${data.length} bus${data.length !== 1 ? 'es' : ''} available`);
            })
            .catch(err => {
                setStatus('ERROR loading buses: ' + err.message);
                console.error(err);
            });
    });

    // Load drivers
    fetch('/drivers')
        .then(r => {
            if (!r.ok) throw new Error('GET /drivers returned ' + r.status);
            return r.json();
        })
        .then(data => {
            const sel = document.getElementById('driverSelect');
            data.forEach(d => {
                const opt = document.createElement('option');
                opt.value = d;
                opt.textContent = d;
                sel.appendChild(opt);
            });
        })
        .catch(err => {
            setStatus('ERROR loading drivers: ' + err.message);
            console.error(err);
        });

    // Load tanks
    fetch('/tanks')
        .then(r => {
            if (!r.ok) throw new Error('GET /tanks returned ' + r.status);
            return r.json();
        })
        .then(data => {
            ['tankSelect', 'refuelTankSelect'].forEach(id => {
                const sel = document.getElementById(id);
                data.forEach(t => {
                    const opt = document.createElement('option');
                    opt.value = t;
                    opt.textContent = t;
                    sel.appendChild(opt);
                });
            });
        })
        .catch(err => {
            setStatus('ERROR loading tanks: ' + err.message);
            console.error(err);
        });

    // Refuel checkbox interactions
    document.getElementById('chkFillAll').addEventListener('change', function () {
        const fillAll = this.checked;
        const chkSelected = document.getElementById('chkFillSelected');
        if (fillAll) chkSelected.checked = false;
        chkSelected.disabled = fillAll;
        document.getElementById('refuelTankSelect').disabled = fillAll;
        document.getElementById('txtRefuelAmount').disabled = fillAll;
    });

    document.getElementById('chkFillSelected').addEventListener('change', function () {
        document.getElementById('txtRefuelAmount').disabled = this.checked;
    });

    // Bus selection change
    document.getElementById('busSelect')
.addEventListener('change', async function () {

    const selected = this.value;

    currentBusIndex = allBuses.indexOf(selected);

    // Reset driver dropdown when bus changes
    document.getElementById('driverSelect').value = '';

    // Hide starting odometer field until we know if it's needed
    document.getElementById('startOdometerField').style.display = 'none';
    document.getElementById('txtStartOdometer').value = '';

    if (!selected) {

        document.getElementById('busName').textContent = 'All Buses';

        document.getElementById('busMeta').textContent =
            'ALL BUS RECORDS';

        clearGrid();

        updateNavButtons();

        return;
    }

    // UPDATE HEADER
    document.getElementById('busName').textContent = selected;

    // Check if this bus has existing records — if not, show starting odometer field
    const hasRecordsResp = await fetch(`/bus/${encodeURIComponent(selected)}/has-records`);
    const hasRecordsData = await hasRecordsResp.json();
    if (!hasRecordsData.hasRecords) {
        document.getElementById('startOdometerField').style.display = 'block';
    }

    // GET LATEST BUS DATA
    const latestResponse = await fetch(
        `/bus/${encodeURIComponent(selected)}`
    );

    const latestData = await latestResponse.json();
    lastKnownOdometer = parseFloat(latestData.currentOdometer);

    document.getElementById('busMeta').textContent =
        `Driver: ${latestData.driverName}
         | Current Odometer:
         ${latestData.currentOdometer} km
         | Fuel Used:
         ${latestData.fuelUsed} L`;

    // LOAD GRID (all drivers for this bus)
    loadGrid(selected);

    updateNavButtons();

    });

    // Driver selection change
    document.getElementById('driverSelect').addEventListener('change', function () {
        const bus    = document.getElementById('busSelect').value;
        const driver = this.value;

        if (!bus) {
            setStatus('Please select a bus first.');
            return;
        }

        if (!driver) {
            // No driver filter — show all records for the bus
            loadGrid(bus);
            document.getElementById('busMeta').textContent =
                `Showing all drivers for ${bus}`;
            return;
        }

        // Show filtered records for this bus + driver
        document.getElementById('busName').textContent = bus;
        document.getElementById('busMeta').textContent =
            `Driver: ${driver} | Bus: ${bus}`;
        loadGrid(bus, driver);
    });

    function loadGrid(busName, driverName) {
        setStatus('Loading...');
        const url = driverName
            ? `/bus/${encodeURIComponent(busName)}/driver/${encodeURIComponent(driverName)}/records`
            : `/bus/${encodeURIComponent(busName)}/records`;
        fetch(url)
            .then(r => r.json())
            .then(rows => {
                renderGrid(rows);
                setStatus(`${rows.length} record${rows.length !== 1 ? 's' : ''}`);
            })
            .catch(() => setStatus('Error loading data.'));
    }

    function renderGrid(rows) {

    const body = document.getElementById('gridBody');

    if (!rows || rows.length === 0) {

        body.innerHTML = `
            <tr>
                <td colspan="10">
                    <div class="empty-state">
                        No records found for this bus
                    </div>
                </td>
            </tr>
        `;

        return;
    }

    body.innerHTML = rows.map(r => {

        const performanceClass =
            (r.performance || '').toLowerCase() === 'good'
                ? 'good'
                : (r.performance || '').toLowerCase() === 'bad'
                    ? 'bad'
                    : '';

        return `
            <tr>

                <td>${r.driverName ?? '—'}</td>

                <td>${r.date ?? '—'}</td>

                <td>${r.previousOdometer ?? '—'}</td>

                <td>${r.currentOdometer ?? '—'}</td>

                <td>${r.totalKm ?? '—'}</td>

                <td>${r.fuelUsed ?? '—'}</td>

                <td>${r.kmPerLitre ?? '—'}</td>

                <td>${r.busAvg ?? '—'}</td>

                <td>${r.driverAvg ?? '—'}</td>

            </tr>
        `;

    }).join('');
}

    function clearGrid() {
        document.getElementById('gridBody').innerHTML =
            '<tr><td colspan="10"><div class="empty-state">Select a bus to load records</div></td></tr>';
        setStatus('—');
    }

    function navigate(dir) {
        const newIndex = currentBusIndex + dir;
        if (newIndex < 0 || newIndex >= allBuses.length) return;
        currentBusIndex = newIndex;
        const busName = allBuses[currentBusIndex];
        document.getElementById('busSelect').value = busName;
        document.getElementById('busName').textContent = busName;
        document.getElementById('busMeta').textContent = 'RECORDS FOR SELECTED BUS';
        loadGrid(busName);
        updateNavButtons();
    }

    function updateNavButtons() {
        document.getElementById('btnPrevious').disabled = currentBusIndex <= 0;
        document.getElementById('btnNext').disabled = currentBusIndex < 0 || currentBusIndex >= allBuses.length - 1;
    }

    function submitEntry() {
        const bus      = document.getElementById('busSelect').value;
        const driver   = document.getElementById('driverSelect').value;
        const odometer = document.getElementById('txtOdometer').value;
        const fuel     = document.getElementById('txtFuel').value;
        const tank     = document.getElementById('tankSelect').value;
        const startOdoEl = document.getElementById('txtStartOdometer');
        const startOdo = startOdoEl.value;
        const startFieldVisible = document.getElementById('startOdometerField').style.display !== 'none';

        if (!bus || !driver || !odometer || !fuel || !tank) {
            alert('Please fill in all fields before submitting.');
            return;
        }

        if (startFieldVisible && !startOdo) {
            alert('This is the first entry for this bus. Please enter the starting odometer reading.');
            return;
        }

        // Figure out the previous odometer reading so we can catch a
        // negative-distance trip before it's even sent to the server.
        const previousOdometer = startFieldVisible && startOdo
        ? parseFloat(startOdo)
        : parseFloat(lastKnownOdometer);
        if (!isNaN(previousOdometer) && parseFloat(odometer) < previousOdometer) {
            alert(`Current odometer (${odometer}) can't be less than the previous odometer (${previousOdometer}). Please check the reading.`);
            return;
        }

        const payload = {
            busName: bus,
            driverName: driver,
            currentOdometer: parseFloat(odometer),
            fuelUsed: parseFloat(fuel),
            tankName: tank
        };
        if (startFieldVisible && startOdo) {
            payload.startOdometer = parseFloat(startOdo);
        }

        fetch('/entry', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
        })
        .then(r => r.json())
        .then(data => {
            if (data.error) {
                alert('Error: ' + data.error);
                return;
            }

    setStatus('Entry saved successfully.');

    // Hide the starting odometer field — bus now has records
    document.getElementById('startOdometerField').style.display = 'none';
    startOdoEl.value = '';

    loadGrid(bus);

    // REFRESH BUS HEADER
    fetch(`/bus/${encodeURIComponent(bus)}`)
        .then(r => r.json())
        .then(data => {

            lastKnownOdometer = parseFloat(data.currentOdometer);

            document.getElementById('busMeta').textContent =
                `Driver: ${data.driverName}
                 | Current Odometer:
                 ${data.currentOdometer} km
                 | Fuel Used:
                 ${data.fuelUsed} L`;

        });

    document.getElementById('txtOdometer').value = '';

    document.getElementById('txtFuel').value = '';
        })
        .catch(() => setStatus('Failed to save entry.'));
    }

    function submitRefuel() {
        const tank        = document.getElementById('refuelTankSelect').value;
        const amount      = document.getElementById('txtRefuelAmount').value;
        const fillSelected = document.getElementById('chkFillSelected').checked;
        const fillAll      = document.getElementById('chkFillAll').checked;

        if (!fillAll && !tank) {
            alert('Please select a tank.');
            return;
        }

        if (!fillAll && !fillSelected && !amount) {
            alert('Please enter the amount of fuel refuelled, or tick a fill option.');
            return;
        }

        const payload = { fillSelected, fillAll };
        if (!fillAll) payload.tankName = tank;
        if (!fillAll && !fillSelected) payload.fuelAmount = parseFloat(amount);

        fetch('/tanks/refuel', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
        })
        .then(r => r.json())
        .then(data => {
            if (data.error) {
                alert('Error: ' + data.error);
                return;
            }

            setStatus(fillAll ? 'All tanks filled to full.' : `${tank} refuelled — now at ${data.level} L.`);

            document.getElementById('txtRefuelAmount').value = '';
            document.getElementById('chkFillSelected').checked = false;
            document.getElementById('chkFillAll').checked = false;
            document.getElementById('refuelTankSelect').disabled = false;
            document.getElementById('txtRefuelAmount').disabled = false;
            document.getElementById('chkFillSelected').disabled = false;
        })
        .catch(() => setStatus('Failed to save refuel.'));
    }

    function setStatus(msg) {
        document.getElementById('statusBar').textContent = msg;
    }

    // ── SIDEBAR TAB SWITCHER ─────────────────────────────────
    function switchSidebarTab(name, btn){
        document.querySelectorAll('.sidebar-pane').forEach(p=>p.classList.remove('active'));
        document.querySelectorAll('.sidebar-tab').forEach(b=>b.classList.remove('active'));
        document.getElementById('pane-'+name).classList.add('active');
        btn.classList.add('active');
        const showingService = name === 'service';
        document.getElementById('recordsView').style.display = showingService ? 'none' : 'flex';
        document.getElementById('serviceMainView').classList.toggle('active', showingService);
        if(showingService) loadServiceCards();
    }

    // ── SERVICE TAB ──────────────────────────────────────────
    async function loadServiceCards(){
        const container = document.getElementById('serviceCards');
        container.innerHTML = '<div class="empty-state">Loading service cards...</div>';
        try {
            const response = await fetch('/analytics/service-cards');
            if(!response.ok) throw new Error('Unable to load service cards');
            const cards = await response.json();
            if(!cards.length){
                container.innerHTML = '<div class="empty-state">No buses found.</div>';
                return;
            }
            const categories = ['Urgent', 'Upcoming', 'Fine'];
            container.innerHTML = categories.map(category => {
                const categoryClass = category.toLowerCase();
                const categoryCards = cards.filter(card => card.category === category);
                return `
                    <section class="service-category service-category-${categoryClass}">
                        <div class="service-category-title">${category} <span>(${categoryCards.length})</span></div>
                        ${categoryCards.length ? categoryCards.map(card => {
                            const distance = card.distanceToService === null ? 'No odometer data' : `${card.distanceToService} km`;
                            const serviceType = card.serviceType || 'Waiting for first trip';
                            return `
                                <div class="service-card card-${categoryClass}">
                                    <div class="service-card-header">
                                        <span class="service-card-bus">${card.busName}</span>
                                        <span class="service-card-category">${card.category}</span>
                                    </div>
                                    <div class="service-card-row"><span>Distance to next service</span><span class="service-card-value">${distance}</span></div>
                                    <div class="service-card-row"><span>Service needed</span><span class="service-card-value">${serviceType}</span></div>
                                </div>`;
                        }).join('') : '<div class="empty-state">No buses in this category.</div>'}
                    </section>`;
            }).join('');
        } catch(error){
            container.innerHTML = '<div class="empty-state">Failed to load service cards.</div>';
        }
    }
</script>
