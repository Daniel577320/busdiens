<!DOCTYPE html>
<html lang="af">
<head>
<meta charset="UTF-8">
<title>Bus Fleet Manager — Dagboek</title>
<link href="https://fonts.googleapis.com/css2?family=Source+Code+Pro:wght@400;600&family=Barlow:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
        --bg:       #dce0e3;
        --panel:    #c8cdd1;
        --group-bg: #d4d8db;
        --border:   #9aa0a6;
        --dark:     #2b3036;
        --accent:   #1a5fa8;
        --text:     #1e2428;
        --muted:    #596068;
        --white:    #f5f7f8;
        --grid-hdr: #3a4750;
        --grid-row: #eaecee;
        --grid-alt: #dde0e3;
        --good:     #2e7d32;
        --bad:      #c62828;
    }
    body {
        font-family: 'Barlow', sans-serif;
        background: var(--bg);
        color: var(--text);
        height: 100vh;
        display: flex;
        flex-direction: column;
        overflow: hidden;
    }

    /* ── SMALL PAGE NAV ── */
    .page-nav {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 6px 14px;
        background: var(--dark);
        flex-shrink: 0;
    }
    .page-nav a {
        color: #9fb8d6;
        text-decoration: none;
        font-family: 'Source Code Pro', monospace;
        font-size: 10px;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        border: 1px solid #4a5560;
        padding: 3px 10px;
        border-radius: 2px;
        transition: all .15s;
    }
    .page-nav a:hover { background: #4a5560; color: white; }
    .page-nav a.current { background: var(--accent); color: white; border-color: var(--accent); }

    .layout {
        display: flex;
        flex: 1;
        overflow: hidden;
        padding: 14px;
        gap: 14px;
    }
    .sidebar {
        width: 235px;
        flex-shrink: 0;
        display: flex;
        flex-direction: column;
        gap: 12px;
        overflow-y: auto;
    }
    .group-box {
        background: var(--group-bg);
        border: 1px solid var(--border);
        border-radius: 3px;
        padding: 12px;
        position: relative;
    }
    .legend {
        position: absolute;
        top: -8px;
        left: 10px;
        background: var(--bg);
        padding: 0 6px;
        font-size: 10px;
        font-weight: 700;
        letter-spacing: 0.09em;
        text-transform: uppercase;
        color: var(--muted);
    }
    .field { margin-bottom: 12px; }
    .field:last-child { margin-bottom: 0; }
    .field label {
        display: block;
        font-size: 10px;
        font-weight: 700;
        letter-spacing: 0.07em;
        text-transform: uppercase;
        color: var(--muted);
        margin-bottom: 4px;
    }
    .field select, .field input[type="number"], .field input[type="date"] {
        width: 100%;
        padding: 6px 8px;
        font-family: 'Barlow', sans-serif;
        font-size: 13px;
        background: var(--white);
        border: 1px solid var(--border);
        border-radius: 2px;
        color: var(--text);
        appearance: none;
        outline: none;
        transition: border-color 0.15s;
    }
    .field select:focus, .field input:focus {
        border-color: var(--accent);
        box-shadow: 0 0 0 2px rgba(26,95,168,0.15);
    }
    .month-year-row { display: grid; grid-template-columns: 1.4fr 1fr; gap: 8px; }

    .date-filter-card {
        border: 1px solid var(--border);
        border-radius: 4px;
        background: var(--white);
        padding: 8px;
    }
    .date-filter-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
        margin-bottom: 8px;
    }
    .date-filter-nav {
        width: 26px;
        height: 26px;
        border: 1px solid var(--border);
        background: var(--panel);
        color: var(--text);
        border-radius: 2px;
        cursor: pointer;
        font-size: 16px;
        line-height: 1;
    }
    .date-filter-nav:hover { background: #bcc2c8; }
    .date-filter-month {
        font-size: 12px;
        font-weight: 700;
        letter-spacing: 0.06em;
        text-transform: uppercase;
        color: var(--accent);
        text-align: center;
        flex: 1;
    }
    .date-filter-weekdays {
        display: grid;
        grid-template-columns: repeat(7, 1fr);
        gap: 4px;
        text-align: center;
        font-size: 9px;
        font-weight: 700;
        letter-spacing: 0.06em;
        text-transform: uppercase;
        color: var(--muted);
        margin-bottom: 4px;
    }
    .date-filter-grid {
        display: grid;
        grid-template-columns: repeat(7, 1fr);
        gap: 4px;
    }
    .day-cell {
        border: 1px solid transparent;
        border-radius: 2px;
        background: var(--grid-row);
        color: var(--text);
        font-size: 11px;
        font-weight: 600;
        padding: 6px 0;
        cursor: pointer;
        transition: all 0.12s;
        position: relative;
    }
    .day-cell:hover { background: #c5daf5; border-color: var(--accent); }
    .day-cell.muted { color: var(--muted); background: #e2e6e9; }
    .day-cell.selected {
        background: var(--accent);
        color: white;
        border-color: var(--accent);
    }
    .day-cell.has-data::after {
        content: '';
        position: absolute;
        bottom: 3px;
        left: 50%;
        transform: translateX(-50%);
        width: 4px;
        height: 4px;
        border-radius: 50%;
        background: currentColor;
        opacity: 0.75;
    }
    .date-filter-clear {
        width: 100%;
        margin-top: 8px;
        border: 1px solid var(--border);
        background: var(--panel);
        color: var(--muted);
        border-radius: 2px;
        padding: 6px 8px;
        font-size: 10px;
        font-weight: 700;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        cursor: pointer;
    }
    .date-filter-clear:hover { background: #bcc2c8; color: var(--text); }

    /* ── TYPE SWITCHER ── */
    .type-btn {
        display: block;
        width: 100%;
        padding: 11px 8px;
        margin-bottom: 6px;
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 2px;
        font-family: 'Barlow', sans-serif;
        font-size: 12px;
        font-weight: 700;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: var(--muted);
        cursor: pointer;
        text-align: center;
        transition: all .12s;
    }
    .type-btn:last-child { margin-bottom: 0; }
    .type-btn.active { background: var(--accent); color: white; border-color: var(--accent); }
    .type-btn:hover:not(.active) { background: #bcc2c8; }

    .stat-line {
        display: flex;
        justify-content: space-between;
        font-size: 11px;
        font-family: 'Source Code Pro', monospace;
        color: var(--muted);
        margin-bottom: 6px;
    }
    .stat-line:last-child { margin-bottom: 0; }
    .stat-line strong { color: var(--text); }

    /* ── MAIN AREA ── */
    .main { flex: 1; display: flex; flex-direction: column; min-width: 0; overflow-y: auto; }
    .page-header {
        display: flex;
        align-items: baseline;
        gap: 14px;
        padding: 0 4px 10px;
        border-bottom: 2px solid var(--border);
        margin-bottom: 10px;
        flex-shrink: 0;
    }
    .page-title { font-size: 24px; font-weight: 700; letter-spacing: -0.01em; color: var(--dark); }
    .page-meta {
        font-size: 10px;
        font-family: 'Source Code Pro', monospace;
        color: var(--muted);
        letter-spacing: 0.06em;
    }

    .toolbar {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 10px;
        flex-shrink: 0;
    }
    .btn-add {
        padding: 7px 18px;
        background: var(--accent);
        color: white;
        border: none;
        border-radius: 2px;
        font-family: 'Barlow', sans-serif;
        font-size: 11px;
        font-weight: 700;
        letter-spacing: 0.1em;
        text-transform: uppercase;
        cursor: pointer;
        transition: background 0.15s;
    }
    .btn-add:hover { background: #154e8e; }

    .grid-wrapper {
        flex-shrink: 0;
        overflow: auto;
        border: 1px solid var(--border);
        border-radius: 2px;
        background: var(--white);
    }
    table { width: 100%; border-collapse: collapse; }
    thead th {
        background: var(--grid-hdr);
        color: #cdd5db;
        font-size: 10px;
        font-weight: 700;
        letter-spacing: 0.1em;
        text-transform: uppercase;
        padding: 9px 10px;
        text-align: left;
        position: sticky;
        top: 0;
        white-space: nowrap;
        border-right: 1px solid rgba(255,255,255,0.07);
        z-index: 1;
    }
    tbody tr:nth-child(even) { background: var(--grid-alt); }
    tbody tr:nth-child(odd)  { background: var(--grid-row); }
    tbody tr:hover           { background: #c5daf5; }
    tbody td {
        padding: 4px 6px;
        border-right: 1px solid rgba(0,0,0,0.06);
        border-bottom: 1px solid rgba(0,0,0,0.05);
        font-family: 'Source Code Pro', monospace;
        font-size: 12px;
    }
    .paid-row-highlight { background: #e0a51a !important; color: #ffffff; }
    .paid-row-highlight button, .paid-row-highlight input { color: #ffffff; }

    th.col-check, td.col-check { text-align: center; width: 34px; }
    th.col-nr, td.col-nr { text-align: center; width: 42px; font-weight: 700; color: var(--muted); }
    th.col-del, td.col-del { text-align: center; width: 32px; }

    .grid-wrapper td input, .grid-wrapper td select {
        width: 100%;
        min-width: 90px;
        border: 1px solid transparent;
        background: transparent;
        font-family: 'Source Code Pro', monospace;
        font-size: 12px;
        color: var(--text);
        padding: 5px 5px;
        border-radius: 2px;
        outline: none;
    }
    .grid-wrapper td input[type="time"] { min-width: 96px; }
    .grid-wrapper td input[type="date"] { min-width: 116px; }
    .grid-wrapper td input[type="checkbox"] { width: auto; min-width: 0; accent-color: var(--accent); cursor: pointer; }
    .grid-wrapper td input:focus, .grid-wrapper td select:focus {
        border-color: var(--accent);
        background: var(--white);
        box-shadow: 0 0 0 2px rgba(26,95,168,0.12);
    }
    .bedrag-wrap { display: flex; align-items: center; gap: 3px; }
    .bedrag-wrap span { color: var(--muted); font-size: 12px; }
    .bedrag-wrap input { min-width: 70px; text-align: right; }

    .row-del-btn {
        background: none;
        border: none;
        color: var(--bad);
        cursor: pointer;
        font-size: 14px;
        font-weight: 700;
        line-height: 1;
        padding: 4px;
    }
    .row-del-btn:hover { color: #8e1f1f; }

    .empty-state {
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 60px;
        color: var(--muted);
        font-family: 'Source Code Pro', monospace;
        font-size: 12px;
        letter-spacing: 0.05em;
    }

    .footer {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 10px 4px 0;
        flex-shrink: 0;
        font-family: 'Source Code Pro', monospace;
        font-size: 11px;
        color: var(--muted);
    }
    .footer .status-msg { color: var(--accent); font-weight: 600; }
    .footer .total-line { font-size: 13px; color: var(--text); }
    .footer .total-line strong { font-size: 15px; }

    .history-panel {
        margin-top: 12px;
        border: 1px solid var(--border);
        border-radius: 2px;
        background: var(--white);
        display: flex;
        flex-direction: column;
        min-height: 240px;
    }
    .history-controls {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        padding: 10px 10px 0;
    }
    .history-control {
        display: flex;
        flex-direction: column;
        gap: 4px;
        min-width: 140px;
        flex: 1;
    }
    .history-control label {
        font-size: 10px;
        font-weight: 700;
        letter-spacing: 0.07em;
        text-transform: uppercase;
        color: var(--muted);
    }
    .history-control input, .history-control select {
        width: 100%;
        padding: 6px 8px;
        font-family: 'Barlow', sans-serif;
        font-size: 13px;
        background: var(--white);
        border: 1px solid var(--border);
        border-radius: 2px;
        color: var(--text);
    }
    .history-table-wrap {
        flex: 1;
        overflow: auto;
        border-top: 1px solid rgba(0,0,0,0.08);
        margin-top: 10px;
    }
    .history-table {
        width: 100%;
        min-width: 640px;
        border-collapse: collapse;
    }
    .history-table th {
        background: var(--grid-hdr);
        color: #cdd5db;
        font-size: 10px;
        font-weight: 700;
        letter-spacing: 0.1em;
        text-transform: uppercase;
        padding: 8px 10px;
        text-align: left;
        position: sticky;
        top: 0;
        z-index: 1;
    }
    .history-table th.col-accept, .history-table td.col-accept {
        width: 34px;
        text-align: center;
        padding-left: 6px;
        padding-right: 6px;
    }
    .history-table td {
        padding: 6px 10px;
        border-bottom: 1px solid rgba(0,0,0,0.06);
        font-family: 'Source Code Pro', monospace;
        font-size: 12px;
        background: var(--white);
    }
    .history-table tbody tr:nth-child(even) td { background: var(--grid-alt); }
    .history-table tbody tr:hover td { background: #c5daf5; }
    .history-row-highlight td { background: #f6e8a8 !important; }
    .history-price-link {
        background: none;
        border: none;
        color: var(--accent);
        cursor: pointer;
        font-family: inherit;
        font-weight: 700;
        padding: 0;
        text-align: left;
    }
    .history-summary {
        display: flex;
        flex-wrap: wrap;
        gap: 12px;
        padding: 8px 10px 10px;
        border-top: 1px solid rgba(0,0,0,0.08);
        font-size: 12px;
        color: var(--muted);
    }
    .history-summary .summary-item {
        display: flex;
        align-items: center;
        gap: 6px;
    }
    .history-summary strong {
        color: var(--text);
    }
    .history-empty {
        padding: 28px 10px;
        color: var(--muted);
        font-family: 'Source Code Pro', monospace;
        font-size: 12px;
        text-align: center;
    }
    .btn-export {
    padding: 8px 16px;
    font-family: 'Barlow', sans-serif;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: .1em;
    text-transform: uppercase;
    background: #2e7d32;
    color: white;
    border: none;
    border-radius: 2px;
    cursor: pointer;
    transition: background .12s;
    }
    .btn-export:hover   { background: #1b5e20; }
    .btn-export:disabled { background: #888; cursor: default; }
</style>
</head>
<body>

<div class="layout">

    <!-- LEFT SIDEBAR -->
    <div class="sidebar">

        <div class="group-box">
            <div class="legend">Tipe</div>
            <button class="type-btn active" id="btnDagboek" onclick="selectView('dagboek')">Dagboek</button>
            <button class="type-btn" id="btnKwotasie" onclick="selectView('kwotasie')">Kwotasie</button>
        </div>

        <div class="group-box">
            <div class="legend">Periode</div>
            <div class="field" style="margin-bottom:0">
                <div class="date-filter-card">
                    <div class="date-filter-header">
                        <button type="button" class="date-filter-nav" onclick="shiftCalendarMonth(-1)" aria-label="Vorige maand">‹</button>
                        <div class="date-filter-month" id="dateFilterMonthLabel"></div>
                        <button type="button" class="date-filter-nav" onclick="shiftCalendarMonth(1)" aria-label="Volgende maand">›</button>
                    </div>
                    <div class="date-filter-weekdays">
                        <span>M</span><span>D</span><span>W</span><span>D</span><span>V</span><span>S</span><span>Z</span>
                    </div>
                    <div class="date-filter-grid" id="dateFilterGrid"></div>
                    <button type="button" class="date-filter-clear" onclick="clearDateFilter()">Alle dae</button>
                </div>
            </div>
        </div>

        <div class="group-box">
            <div class="legend">Opsomming</div>
            <div class="stat-line"><span>Inskrywings</span><strong id="rowCount">0</strong></div>
            <div class="stat-line"><span>Totaal</span><strong id="totalAmount">R 0.00</strong></div>
        </div>

    </div>

    <!-- MAIN AREA -->
    <div class="main">

        <div class="page-header">
            <div class="page-title" id="pageTitle">Dagboek</div>
            <div class="page-meta" id="pageMeta">—</div>
        </div>

        <div class="toolbar">
            <button class="btn-add" onclick="addRow()">+ Voeg Ry By</button>
            <button class="btn-export" id="exportBtn" onclick="exportDagboek()"> Export</button>
            <div id="loadStatus" style="font-family:'Source Code Pro',monospace;font-size:11px;color:var(--muted)"></div>
        </div>

        <div class="grid-wrapper">
            <datalist id="quoteKlientList"></datalist>
            <datalist id="quoteBestemmingList"></datalist>
            <table>
                <thead id="tableHead"></thead>
                <tbody id="tableBody">
                    <tr><td colspan="10"><div class="empty-state">Laai…</div></td></tr>
                </tbody>
            </table>
        </div>

        <div id="quoteHistoryPanel" class="history-panel" style="display:none;">
            <div class="history-controls">
                <div class="history-control">
                    <label for="historyYearFilter">Jaar</label>
                    <select id="historyYearFilter"></select>
                </div>
                <div class="history-control">
                    <label for="historyClientFilter">Klient</label>
                    <select id="historyClientFilter"></select>
                </div>
                <div class="history-control">
                    <label for="historyBusFilter">Bus</label>
                    <select id="historyBusFilter"></select>
                </div>
                <div class="history-control">
                    <label for="historyDestinationFilter">Bestemming</label>
                    <select id="historyDestinationFilter" multiple size="1" aria-label="Kies een of meer bestemmings"></select>
                </div>
                <div class="history-control">
                    <label for="historyTipeFilter">Tipe Trip</label>
                    <select id="historyTipeFilter"></select>
                </div>
                <div class="history-control">
                    <label for="historyAanvaarFilter">Aanvaar</label>
                    <select id="historyAanvaarFilter"><option value="">Alle</option><option value="1">Aanvaar</option><option value="0">Nie Aanvaar Nie</option></select>
                </div>
                <div class="history-control">
                    <label for="historyStreekFilter">Streek</label>
                    <select id="historyStreekFilter"></select>
                </div>
            </div>
            <div class="history-table-wrap">
                <table class="history-table">
                    <thead>
                        <tr>
                            <th>Datum</th>
                            <th>Bus</th>
                            <th>Klient</th>
                            <th>Bestemming</th>
                            <th class="col-accept">Aanvaar</th>
                            <th>Tipe Trip</th>
                            <th>Streek</th>
                            <th>Bedrag</th>
                            <th>Bestuurder</th>
                        </tr>
                    </thead>
                    <tbody id="historyTableBody">
                        <tr><td colspan="7"><div class="history-empty">Laai…</div></td></tr>
                    </tbody>
                </table>
            </div>
            <div class="history-summary" id="historySummary"></div>
        </div>

        <div class="footer">
            <div class="status-msg" id="statusMsg"></div>
            <div class="total-line">Totaal vir maand: <strong id="footerTotal">R 0.00</strong></div>
        </div>

    </div>
</div>

<script>
    const AFRIKAANS_MONTHS = ["Januarie","Februarie","Maart","April","Mei","Junie",
                               "Julie","Augustus","September","Oktober","November","Desember"];

    // ── Data layer ──────────────────────────────────────────
    // This reads/writes the client's real Access database (Kwotasie/Bustipe/
    // Busse/Werkers/Bestemming) via the /dagboek/entries endpoints in main.py,
    // which in turn use access_db.py. See access_db.py for the full mapping
    // and design notes.
    async function fetchEntries(year, month, type) {
        const r = await fetch(`/dagboek/entries?year=${year}&month=${month + 1}&type=${type}`);
        if (!r.ok) {
            const err = await r.json().catch(() => ({}));
            throw new Error(err.error || `GET /dagboek/entries returned ${r.status}`);
        }
        return r.json();
    }

    async function apiCreateEntry(entry, type) {
        const r = await fetch('/dagboek/entries', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ ...entry, type })
        });
        if (!r.ok) {
            const err = await r.json().catch(() => ({}));
            throw new Error(err.error || `POST /dagboek/entries returned ${r.status}`);
        }
        return r.json();
    }

    async function apiUpdateField(id, field, value) {
        const r = await fetch(`/dagboek/entries/${id}`, {
            method: 'PATCH',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ field, value })
        });
        if (!r.ok) {
            const err = await r.json().catch(() => ({}));
            throw new Error(err.error || `PATCH /dagboek/entries/${id} returned ${r.status}`);
        }
        return r.json();
    }

    async function apiAccept(id) {
        const r = await fetch(`/dagboek/entries/${id}/accept`, { method: 'POST' });
        if (!r.ok) {
            const err = await r.json().catch(() => ({}));
            throw new Error(err.error || `POST accept returned ${r.status}`);
        }
        return r.json();
    }

    async function apiDelete(id) {
        const r = await fetch(`/dagboek/entries/${id}`, { method: 'DELETE' });
        if (!r.ok) {
            const err = await r.json().catch(() => ({}));
            throw new Error(err.error || `DELETE returned ${r.status}`);
        }
        return r.json();
    }

    async function apiLoadHistory() {
        const r = await fetch('/dagboek/history');
        if (!r.ok) {
            const err = await r.json().catch(() => ({}));
            throw new Error(err.error || `GET /dagboek/history returned ${r.status}`);
        }
        return r.json();
    }

    function blankEntry(defaultDate) {
        return { id: null, datum: defaultDate, bus: '', klientID: '', bestemming: '',
                 tydOplaai: '', tydTerug: '', bedrag: '', bestuurder: '', opmerkings: '',
                 seater: '', tipeTrip: '', dateCreated: '', finaliseerDatum: '', datumTerug: '',
                 trailer: 0, faktuur: '' };
    }

    // Normalize time values to HH:MM format (24-hour, no seconds)
    function normalizeTimeValue(value) {
        if (!value) return '';
        // Extract HH:MM from any format (HH:MM:SS, 12-hour, etc.)
        const match = String(value).match(/(\d{1,2}):(\d{2})(?::(\d{2}))?/);
        if (!match) return '';
        const hours = String(match[1]).padStart(2, '0');
        const minutes = match[2];
        return `${hours}:${minutes}`;
    }
    function todayInSelectedMonth() {
        const now = new Date();
        const day = (currentYear === now.getFullYear() && currentMonthIdx === now.getMonth())
            ? now.getDate() : 1;
        return `${currentYear}-${String(currentMonthIdx + 1).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
    }

    // Date to use for a newly-added row: the day selected in the calendar
    // date filter if one is active, otherwise today's day (in the currently
    // viewed month).
    function dateForNewRow() {
        if (currentDayFilter) {
            const day = parseInt(currentDayFilter, 10);
            return `${currentYear}-${String(currentMonthIdx + 1).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
        }
        return todayInSelectedMonth();
    }

    // ── State ────────────────────────────────────────────────
    let busList = [];
    let driverList = [];
    let seaterList = [];
    let tripTypeList = [];
    let seaterMap = {};
    let currentType = 'dagboek';
    let currentDayFilter = '';
    let currentYear, currentMonthIdx;
    let currentRows = [];   // rows currently rendered, straight from Access
    let historyRows = [];
    let historyFilters = { year: '', client: '', bus: '', destination: [], streek: '', tipe: '', aanvaar: '' };
    let highlightedQuoteId = null;

    async function init() {
        const now = new Date();
        currentYear = now.getFullYear();
        currentMonthIdx = now.getMonth();
        currentDayFilter = '';

        attachHistoryFilterHandlers();

        await loadDropdownData();
        await loadQuoteHistory();
        await refreshTable();
        updateExportBtn();
    }

    async function loadDropdownData() {
        try {
            const [buses, drivers, busRows, seaters, tripTypes] = await Promise.all([
                fetch('/buses').then(r => r.json()),
                fetch('/drivers').then(r => r.json()),
                fetch('/admin/buses').then(r => r.json()),
                fetch('/seaters').then(r => r.json()),
                fetch('/trip-types').then(r => r.json())
            ]);
            busList = buses;
            driverList = drivers;
            seaterList = seaters;
            tripTypeList = tripTypes;
            seaterMap = {};
            busRows.forEach(b => { seaterMap[b.BusNames] = b.Seater; });
        } catch (e) {
            console.error('Kon nie bus/bestuurder/seater lyste laai nie', e);
        }
    }

    async function loadQuoteHistory() {
        try {
            historyRows = await apiLoadHistory();
        } catch (e) {
            console.error('Kon nie kwotasie-geskiedenis laai nie', e);
            historyRows = [];
        }
        renderQuoteHistory();
    }

    function attachHistoryFilterHandlers() {
        ['historyYearFilter','historyClientFilter','historyBusFilter','historyDestinationFilter','historyTipeFilter','historyAanvaarFilter','historyStreekFilter']
            .forEach(id => document.getElementById(id).addEventListener('change', readHistoryFilters));
    }

    function readHistoryFilters() {
        historyFilters.year        = document.getElementById('historyYearFilter').value;
        historyFilters.client      = document.getElementById('historyClientFilter').value;
        historyFilters.bus         = document.getElementById('historyBusFilter').value;
        historyFilters.destination = [...document.getElementById('historyDestinationFilter').selectedOptions].map(option => option.value);
        historyFilters.tipe        = document.getElementById('historyTipeFilter').value;
        historyFilters.aanvaar     = document.getElementById('historyAanvaarFilter').value;
        historyFilters.streek      = document.getElementById('historyStreekFilter').value;
        renderQuoteHistory();
    }

    function shiftCalendarMonth(offset) {
        currentMonthIdx += offset;
        if (currentMonthIdx < 0) {
            currentMonthIdx = 11;
            currentYear -= 1;
        } else if (currentMonthIdx > 11) {
            currentMonthIdx = 0;
            currentYear += 1;
        }
        currentDayFilter = '';
        refreshTable();
    }

    function selectCalendarDay(day) {
        currentDayFilter = String(day);
        renderTable();
        renderDateFilterCalendar();
    }

    function clearDateFilter() {
        currentDayFilter = '';
        renderTable();
        renderDateFilterCalendar();
    }

    function renderDateFilterCalendar() {
        const label = document.getElementById('dateFilterMonthLabel');
        const grid = document.getElementById('dateFilterGrid');
        if (!label || !grid) return;

        label.textContent = `${AFRIKAANS_MONTHS[currentMonthIdx]} ${currentYear}`;

        const firstOfMonth = new Date(currentYear, currentMonthIdx, 1);
        const daysInMonth = new Date(currentYear, currentMonthIdx + 1, 0).getDate();
        const firstWeekday = (firstOfMonth.getDay() + 6) % 7;
        const prevMonthDays = new Date(currentYear, currentMonthIdx, 0).getDate();
        const cells = [];

        for (let i = 0; i < firstWeekday; i += 1) {
            const day = prevMonthDays - firstWeekday + i + 1;
            cells.push(`<button type="button" class="day-cell muted" disabled>${day}</button>`);
        }

        for (let day = 1; day <= daysInMonth; day += 1) {
            const dayString = `${currentYear}-${String(currentMonthIdx + 1).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
            const hasData = currentRows.some(r => (r.datum || '').slice(0, 10) === dayString);
            const selected = currentDayFilter && Number(currentDayFilter) === day;
            const classes = ['day-cell'];
            if (selected) classes.push('selected');
            if (hasData) classes.push('has-data');
            cells.push(`<button type="button" class="${classes.join(' ')}" onclick="selectCalendarDay(${day})">${day}</button>`);
        }

        while (cells.length % 7 !== 0) {
            const nextDay = cells.length - firstWeekday - daysInMonth + 1;
            cells.push(`<button type="button" class="day-cell muted" disabled>${nextDay}</button>`);
        }

        grid.innerHTML = cells.join('');
    }

    function selectView(type) {
        currentType = type;
        document.getElementById('btnDagboek').classList.toggle('active', type === 'dagboek');
        document.getElementById('btnKwotasie').classList.toggle('active', type === 'kwotasie');
        document.getElementById('pageTitle').textContent = type === 'dagboek' ? 'Dagboek' : 'Kwotasie';
        refreshTable();
        updateExportBtn();
    }

    function busOptions(selected) {
        return '<option value=""></option>' +
            busList.map(b => `<option value="${escapeAttr(b)}" ${b === selected ? 'selected' : ''}>${escapeHtml(b)}</option>`).join('');
    }
    function driverOptions(selected) {
        return '<option value=""></option>' +
            driverList.map(d => `<option value="${escapeAttr(d)}" ${d === selected ? 'selected' : ''}>${escapeHtml(d)}</option>`).join('');
    }
    function seaterOptions(selected) {
        return '<option value=""></option>' +
            seaterList.map(s => `<option value="${escapeAttr(s)}" ${String(s) === String(selected) ? 'selected' : ''}>${escapeHtml(String(s))}</option>`).join('');
    }
    function tripTypeOptions(selected) {
        return '<option value=""></option>' +
            tripTypeList.map(t => `<option value="${escapeAttr(t)}" ${t === selected ? 'selected' : ''}>${escapeHtml(t)}</option>`).join('');
    }

    async function refreshTable() {
        const loadStatus = document.getElementById('loadStatus');
        loadStatus.textContent = 'Laai vanaf databasis…';
        document.getElementById('pageMeta').textContent =
            `${AFRIKAANS_MONTHS[currentMonthIdx].toUpperCase()} ${currentYear}`;

        try {
            currentRows = await fetchEntries(currentYear, currentMonthIdx, currentType);
            loadStatus.textContent = '';
        } catch (e) {
            loadStatus.textContent = 'Kon nie laai nie: ' + e.message;
            currentRows = [];
        }
        renderTable();
        renderQuoteHistory();
    }

    function renderTable() {
        const isKwotasie = currentType === 'kwotasie';

        // Build the header as a list so colCount can never drift out of sync
        // with what's actually rendered per row below.
        const headerCells = [];
        if (isKwotasie) headerCells.push('<th class="col-check">&#10003;</th>');
        headerCells.push('<th class="col-nr">NR</th>');
        headerCells.push('<th>Datum</th>');
        headerCells.push('<th>Seater</th>');
        if (!isKwotasie) headerCells.push('<th>Trailer</th>');
        headerCells.push('<th>Klient</th>');
        headerCells.push('<th>Bestemming</th>');
        headerCells.push('<th>Tyd Oplaai</th>');
        headerCells.push('<th>Tyd Terug</th>');
        headerCells.push('<th>Bedrag</th>');
        if (!isKwotasie) headerCells.push('<th>Bestuurder</th>');
        if (!isKwotasie) headerCells.push('<th>Bus</th>');
        headerCells.push('<th>Opmerkings</th>');
        if (isKwotasie) headerCells.push('<th>Tipe Trip</th>');
        if (isKwotasie) headerCells.push('<th>Datum Terug</th>');
        if (isKwotasie) headerCells.push('<th>Datum Geskep</th>');
        if (!isKwotasie) headerCells.push('<th>Finaliseer Datum</th>');
        if (!isKwotasie) headerCells.push('<th>Betaal</th>');
        if (!isKwotasie) headerCells.push('<th>Faktuur</th>');
        headerCells.push('<th class="col-del"></th>');
        const colCount = headerCells.length;

        const thead = document.getElementById('tableHead');
        thead.innerHTML = `<tr>${headerCells.join('')}</tr>`;

        const displayRows = currentDayFilter
            ? currentRows.filter(r => parseInt((r.datum || '').split('-')[2], 10) === parseInt(currentDayFilter, 10)).sort((a, b) => {
                const aTime = (a.tydOplaai || '').toString().trim();
                const bTime = (b.tydOplaai || '').toString().trim();
                if (!aTime && !bTime) return 0;
                if (!aTime) return 1;
                if (!bTime) return -1;
                return aTime.localeCompare(bTime, undefined, { numeric: true, sensitivity: 'base' });
            })
            : currentRows;

        // Mark days that have entries with a dot in the day select
        const daysSel = document.getElementById('daySelect');
        if (daysSel) {
            const daysWithData = new Set(currentRows.map(r => parseInt((r.datum||'').split('-')[2],10)).filter(n=>!isNaN(n)));
            [...daysSel.options].forEach(o => {
                if (o.value) o.textContent = daysWithData.has(parseInt(o.value)) ? `${o.value} ●` : o.value;
            });
        }

        const tbody = document.getElementById('tableBody');
        if (displayRows.length === 0) {
            const msg = isKwotasie
                ? 'Geen kwotasies vir hierdie maand nie — klik "+ Voeg Ry By" om te begin.'
                : 'Geen inskrywings vir hierdie maand nie — klik "+ Voeg Ry By" om te begin.';
            tbody.innerHTML = `<tr><td colspan="${colCount}"><div class="empty-state">${msg}</div></td></tr>`;
        } else {
            tbody.innerHTML = displayRows.map((r, i) => renderRow(r, i, isKwotasie)).join('');
        }

        // Apply paid highlighting for Dagboek rows (orange) skipping Seater cell
        if (!isKwotasie) {
            Array.from(tbody.querySelectorAll('tr[data-id]')).forEach(tr => {
                const id = tr.getAttribute('data-id');
                const entry = displayRows.find(r => String(r.id) === String(id));
                const paid = entry && isPaidValue(entry.betaal);
                tr.querySelectorAll('td').forEach(td => {
                    try {
                        const sel = td.querySelector && td.querySelector('select');
                        const isSeater = sel && (sel.getAttribute('onchange') || '').includes("'seater'");
                        if (paid && !isSeater) td.classList.add('paid-row-highlight');
                        else td.classList.remove('paid-row-highlight');
                    } catch (e) { /* ignore */ }
                });
            });
        }

        const total = displayRows.reduce((sum, r) => sum + (parseFloat(r.bedrag) || 0), 0);
        const totalStr = 'R ' + total.toLocaleString('af-ZA', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
        document.getElementById('totalAmount').textContent = totalStr;
        document.getElementById('footerTotal').textContent = totalStr;
        document.getElementById('rowCount').textContent = displayRows.length;
        renderSuggestionDatalists();
        renderDateFilterCalendar();
    }

    function busSeaterLabel(busName) {
        return seaterMap[busName] || busName || '—';
    }

    // Colour-codes the Seater column so dispatch can scan a day at a glance.
    // Matches on the "DD" / "PB1" / "PB2" special codes first (these are
    // specific double-decker/premium buses, not seat counts), then falls
    // back to parsing a seat-count number out of whatever's in the cell
    // (e.g. "40 Seater" -> 40). Anything not covered by a rule below (e.g.
    // 35 Seater) is left uncoloured rather than guessing.
    function seaterColorStyle(value) {
        const v = (value || '').trim().toUpperCase();
        if (!v) return null;
        if (v === 'DD' || v.includes('DD')) return { bg: '#1565c0', fg: '#ffffff' };       // Blue
        if (v.includes('PB1') || v.includes('PB2')) return { bg: '#6a1b9a', fg: '#ffffff' }; // Purple
        const match = v.match(/\d+/);
        if (!match) return null;
        const num = parseInt(match[0], 10);
        if (num === 80) return { bg: '#2e7d32', fg: '#ffffff' };              // Green
        if (num === 75) return { bg: '#2e7d32', fg: '#ffffff' };              // Dark Yellow
        if (num === 58) return { bg: '#ad1457', fg: '#ffffff' };              // Dark Pink
        if (num === 40) return { bg: '#fffe04', fg: '#1e2428' };              // Geel
        if (num === 36 || num === 32) return { bg: '#ef6c00', fg: '#ffffff' }; // Orange
        if (num >= 13 && num <= 22) return { bg: '#ec407a', fg: '#ffffff' };   // Pink
        return null;
    }

    function applySeaterColor(selectEl) {
        const style = seaterColorStyle(selectEl.value);
        selectEl.style.backgroundColor = style ? style.bg : '';
        selectEl.style.color = style ? style.fg : '';
    }

    function isPaidValue(value) {
        return value === true || value === 1 || value === '1' || value === 'true' || value === 'TRUE';
    }

    function readOnlyCell(value) {
        return `<td style="font-family:'Source Code Pro',monospace;font-size:11px;padding:4px 8px">
                    ${value ? escapeHtml(value) : '<span style="color:var(--muted)">—</span>'}
                </td>`;
    }

    function renderRow(r, index, isKwotasie) {
        const checkboxCell = isKwotasie
            ? `<td class="col-check"><input type="checkbox" onchange="moveToDagboek(${r.id}, this)" title="Skuif na Dagboek"></td>`
            : '';

        // Seater: editable in both views now. Falls back to deriving a
        // seater from the assigned bus for older rows that predate this
        // column (imported/created before seater existed). Colour-coded
        // per seaterColorStyle so it also doubles as a visual legend.
        const seaterValue = r.seater || (r.bus ? busSeaterLabel(r.bus) : '');
        const seaterStyle = seaterColorStyle(seaterValue);
        const seaterStyleAttr = seaterStyle
            ? ` style="background-color:${seaterStyle.bg};color:${seaterStyle.fg};font-weight:600"`
            : '';
        const seaterCell = `<td><select${seaterStyleAttr} onchange="updateField(${r.id},'seater',this.value); applySeaterColor(this)">${seaterOptions(seaterValue)}</select></td>`;

        // Trailer: Dagboek-only tickbox, right next to Seater.
        const trailerCell = !isKwotasie
            ? `<td style="text-align:center"><input type="checkbox" ${isPaidValue(r.trailer) ? 'checked' : ''} onchange="toggleTrailer(${r.id}, this.checked)"></td>`
            : '';

        // Bus: only assigned once a trip is in Dagboek — the actual vehicle
        // isn't known yet at the Kwotasie stage.
        const bestuurderCell = !isKwotasie
            ? `<td><select onchange="updateField(${r.id},'bestuurder',this.value)">${driverOptions(r.bestuurder)}</select></td>`
            : '';
        const busCell = !isKwotasie
            ? `<td><select onchange="updateField(${r.id},'bus',this.value)">${busOptions(r.bus)}</select></td>`
            : '';

        // Tipe Trip + Datum Terug + Datum Geskep: Kwotasie-only. Datum Terug
        // only makes sense (and is only editable) for multi-day trip types —
        // for a same-day Dag-Retoer it's shown greyed out rather than as a
        // live input, since there's nothing to enter. Datum Geskep is
        // stamped once by the server at creation and never edited here.
        const tipeTripCell = isKwotasie
            ? `<td><select onchange="updateField(${r.id},'tipeTrip',this.value)">${tripTypeOptions(r.tipeTrip)}</select></td>`
            : '';
        const needsDatumTerug = r.tipeTrip === 'Toer-Retoer' || r.tipeTrip === 'Toer-Oorslaap';
        const datumTerugCell = isKwotasie
            ? (needsDatumTerug
                ? `<td><input type="date" value="${escapeAttr(r.datumTerug)}" onchange="updateField(${r.id},'datumTerug',this.value)"></td>`
                : `<td style="text-align:center;color:var(--muted)">—</td>`)
            : '';
        const dateCreatedCell = isKwotasie ? readOnlyCell(r.dateCreated) : '';

        // finaliseerDatum: stamped automatically when a Kwotasie is ticked
        // and moved across, shown read-only in Dagboek (not in Kwotasie,
        // since it doesn't have a value yet at that point).
        const finaliseerCell = !isKwotasie ? readOnlyCell(r.finaliseerDatum) : '';
        const paidCell = !isKwotasie ? `<td class="col-paid"><label><input type="checkbox" ${isPaidValue(r.betaal) ? 'checked' : ''} onchange="togglePaid(${r.id}, this.checked)"> Betaal</label></td>` : '';

        // Faktuur: Dagboek-only free-text invoice reference, right after Betaal.
        const faktuurCell = !isKwotasie
            ? `<td><input type="text" value="${escapeAttr(r.faktuur)}" onchange="updateField(${r.id},'faktuur',this.value)" placeholder="—"></td>`
            : '';

        return `<tr data-id="${r.id}">
            ${checkboxCell}
            <td class="col-nr">${index + 1}</td>
            <td><input type="date" value="${escapeAttr(r.datum)}" onchange="updateField(${r.id},'datum',this.value)"></td>
            ${seaterCell}
            ${trailerCell}
            <td><input type="text" value="${escapeAttr(r.klientID)}" list="quoteKlientList" onchange="updateField(${r.id},'klientID',this.value)" placeholder="Maatskappy"></td>
            <td><input type="text" value="${escapeAttr(r.bestemming)}" list="quoteBestemmingList" onchange="updateField(${r.id},'bestemming',this.value)" placeholder="—"></td>
            <td><input type="time" step="60" value="${escapeAttr(normalizeTimeValue(r.tydOplaai))}" onchange="updateField(${r.id},'tydOplaai',normalizeTimeValue(this.value))"></td>
            <td><input type="time" step="60" value="${escapeAttr(normalizeTimeValue(r.tydTerug))}" onchange="updateField(${r.id},'tydTerug',normalizeTimeValue(this.value))"></td>
            <td><div class="bedrag-wrap"><span>R</span><input type="number" step="0.01" value="${escapeAttr(r.bedrag)}" onchange="updateField(${r.id},'bedrag',this.value)" placeholder="0.00"></div></td>
            ${bestuurderCell}
            ${busCell}
            <td><input type="text" value="${escapeAttr(r.opmerkings)}" onchange="updateField(${r.id},'opmerkings',this.value)" placeholder="—"></td>
            ${tipeTripCell}
            ${datumTerugCell}
            ${dateCreatedCell}
            ${finaliseerCell}
            ${paidCell}
            ${faktuurCell}
            <td class="col-del"><button class="row-del-btn" onclick="deleteRow(${r.id})" title="Verwyder ry">&#10005;</button></td>
        </tr>`;
    }


    function renderSuggestionDatalists() {
        const values = [...historyRows, ...currentRows];
        const klientValues = [...new Set(values.map(r => r.klientID).filter(Boolean))].sort((a, b) => a.localeCompare(b, 'af'));
        const bestemmingValues = [...new Set(values.map(r => r.bestemming).filter(Boolean))].sort((a, b) => a.localeCompare(b, 'af'));
        const busValues = [...new Set([...values.map(r => r.bus).filter(Boolean), ...busList].filter(Boolean))].sort((a, b) => a.localeCompare(b, 'af'));

        const klientList = document.getElementById('quoteKlientList');
        const bestemmingList = document.getElementById('quoteBestemmingList');
        const historyKlientList = document.getElementById('historyKlientOptions');
        const historyBusList = document.getElementById('historyBusOptions');
        const historyBestemmingList = document.getElementById('historyBestemmingOptions');

        if (klientList) klientList.innerHTML = klientValues.map(v => `<option value="${escapeAttr(v)}"></option>`).join('');
        if (bestemmingList) bestemmingList.innerHTML = bestemmingValues.map(v => `<option value="${escapeAttr(v)}"></option>`).join('');
        if (historyKlientList) historyKlientList.innerHTML = klientValues.map(v => `<option value="${escapeAttr(v)}"></option>`).join('');
        if (historyBusList) historyBusList.innerHTML = busValues.map(v => `<option value="${escapeAttr(v)}"></option>`).join('');
        if (historyBestemmingList) historyBestemmingList.innerHTML = bestemmingValues.map(v => `<option value="${escapeAttr(v)}"></option>`).join('');
    }

    function renderQuoteHistory() {
        const panel = document.getElementById('quoteHistoryPanel');
        if (currentType !== 'kwotasie') {
            panel.style.display = 'none';
            return;
        }

        panel.style.display = 'flex';
        renderSuggestionDatalists();

        function buildSel(id, values, allLabel, cur) {
            const select = document.getElementById(id);
            const selectedValues = Array.isArray(cur) ? cur : [cur];
            const allOption = select.multiple ? '' : `<option value="">${allLabel}</option>`;
            select.innerHTML = allOption + values.map(v =>
                `<option value="${escapeAttr(v)}"${selectedValues.includes(v) ? ' selected' : ''}>${escapeHtml(v)}</option>`
            ).join('');
        }
        const years   = [...new Set(historyRows.map(r=>String((r.datum||'').slice(0,4))).filter(Boolean))].sort((a,b)=>b-a);
        const clients = [...new Set(historyRows.map(r=>r.klientID||'').filter(Boolean))].sort((a,b)=>a.localeCompare(b,'af'));
        const buses   = [...new Set(historyRows.map(r=>r.bus||'').filter(Boolean))].sort((a,b)=>a.localeCompare(b,'af'));
        const clientRows = historyFilters.client
            ? historyRows.filter(r => (r.klientID || '') === historyFilters.client)
            : historyRows;
        const dests   = [...new Set(clientRows.map(r=>r.bestemming||'').filter(Boolean))].sort((a,b)=>a.localeCompare(b,'af'));
        historyFilters.destination = historyFilters.destination.filter(destination => dests.includes(destination));
        const streke  = [...new Set(historyRows.map(r=>r.streek||'').filter(Boolean))].sort((a,b)=>a.localeCompare(b,'af'));
        const tipes   = [...new Set(historyRows.map(r=>r.tipeTrip||'').filter(Boolean))].sort((a,b)=>a.localeCompare(b,'af'));

        buildSel('historyYearFilter',       years,   'Alle Jare',         historyFilters.year);
        buildSel('historyClientFilter',     clients, 'Alle Kliente',      historyFilters.client);
        buildSel('historyBusFilter',        buses,   'Alle Busse',        historyFilters.bus);
        buildSel('historyDestinationFilter',dests,   'Alle Bestemmings',  historyFilters.destination);
        buildSel('historyTipeFilter',       tipes,   'Alle Tipes',        historyFilters.tipe);
        buildSel('historyStreekFilter',     streke,  'Alle Streke',       historyFilters.streek);

        const filtered = historyRows
            .filter(r => {
                const yearMatch   = !historyFilters.year        || String((r.datum||'').slice(0,4)) === historyFilters.year;
                const clientMatch = !historyFilters.client      || (r.klientID||'')   === historyFilters.client;
                const busMatch    = !historyFilters.bus         || (r.bus||'')        === historyFilters.bus;
                const destMatch   = historyFilters.destination.length === 0 || historyFilters.destination.includes(r.bestemming || '');
                const streekMatch = !historyFilters.streek      || (r.streek||'')     === historyFilters.streek;
                const tipeMatch   = !historyFilters.tipe        || (r.tipeTrip||'')   === historyFilters.tipe;
                const aanvaarMatch= historyFilters.aanvaar === '' || historyFilters.aanvaar == null || String(r.aanvaar) === String(historyFilters.aanvaar);
                return yearMatch && clientMatch && busMatch && destMatch && streekMatch && tipeMatch && aanvaarMatch;
            })
            .sort((a, b) => {
                const dateDiff = (b.datum || '').localeCompare(a.datum || '');
                return dateDiff !== 0 ? dateDiff : (Number(b.id) || 0) - (Number(a.id) || 0);
            });

        const tbody = document.getElementById('historyTableBody');
        if (filtered.length === 0) {
            tbody.innerHTML = '<tr><td colspan="9"><div class="history-empty">Geen kwotasies vir die huidige filters nie.</div></td></tr>';
        } else {
            tbody.innerHTML = filtered.map(r => renderHistoryRow(r)).join('');
        }

        document.getElementById('historySummary').innerHTML = renderHistorySummary(filtered);
    }

    function renderHistoryRow(r) {
        const price = parseFloat(r.bedrag);
        const priceStr = Number.isFinite(price)
            ? 'R ' + price.toLocaleString('af-ZA', { minimumFractionDigits: 2, maximumFractionDigits: 2 })
            : '—';
        const highlightClass = Number(highlightedQuoteId) === Number(r.id) ? 'history-row-highlight' : '';
        const accepted = String(r.aanvaar || '') === '1' || r.aanvaar === true || r.aanvaar === 1;
        return `<tr class="${highlightClass}" data-id="${r.id}">
            <td>${escapeHtml(r.datum || '')}</td>
            <td>${escapeHtml(r.bus || '')}</td>
            <td>${escapeHtml(r.klientID || '')}</td>
            <td>${escapeHtml(r.bestemming || '')}</td>
            <td class="col-accept">${accepted ? '✓' : ''}</td>
            <td>${escapeHtml(r.tipeTrip || '')}</td>
            <td>${escapeHtml(r.streek || '')}</td>
            <td><button type="button" class="history-price-link" onclick="highlightQuoteRow(${r.id})">${escapeHtml(priceStr)}</button></td>
            <td>${escapeHtml(r.bestuurder || '')}</td>
        </tr>`;
    }

    function renderHistorySummary(rows) {
        const prices = rows.map(r => parseFloat(r.bedrag)).filter(n => Number.isFinite(n));
        if (prices.length === 0) {
            return '<div class="summary-item"><span>Laagste prys</span><strong>R 0.00</strong></div>' +
                '<div class="summary-item"><span>Gemiddelde prys</span><strong>R 0.00</strong></div>' +
                '<div class="summary-item"><span>Hoogste prys</span><strong>R 0.00</strong></div>';
        }

        const lowest = Math.min(...prices);
        const highest = Math.max(...prices);
        const average = prices.reduce((sum, value) => sum + value, 0) / prices.length;
        const lowestRow = rows.find(r => parseFloat(r.bedrag) === lowest);
        const highestRow = rows.find(r => parseFloat(r.bedrag) === highest);

        return `
            <div class="summary-item"><span>Laagste prys</span><button type="button" class="history-price-link" onclick="highlightQuoteRow(${lowestRow ? lowestRow.id : ''})">${formatCurrency(lowest)}</button></div>
            <div class="summary-item"><span>Gemiddelde prys</span><strong>${formatCurrency(average)}</strong></div>
            <div class="summary-item"><span>Hoogste prys</span><button type="button" class="history-price-link" onclick="highlightQuoteRow(${highestRow ? highestRow.id : ''})">${formatCurrency(highest)}</button></div>`;
    }

    function highlightQuoteRow(id) {
        highlightedQuoteId = Number(highlightedQuoteId) === Number(id) ? null : id;
        renderQuoteHistory();
    }

    function formatCurrency(value) {
        return 'R ' + value.toLocaleString('af-ZA', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
    }

    async function updateField(id, field, value) {
        // Update our local copy immediately so the total/UI feels instant,
        // then persist to Access in the background.
        const entry = currentRows.find(r => r.id === id);
        if (entry) {
            // Normalize time fields to HH:MM format
            if ((field === 'tydOplaai' || field === 'tydTerug') && value) {
                value = normalizeTimeValue(value);
            }
            entry[field] = value;
            if (field === 'bedrag' || field === 'tipeTrip') renderTable();
            syncHistoryEntry(id, field, value);
        }
        try {
            await apiUpdateField(id, field, value);
        } catch (e) {
            setStatus('Kon nie stoor nie: ' + e.message);
        }
    }

    
    async function togglePaid(id, checked) {
        const entry = currentRows.find(r => Number(r.id) === Number(id));
        if (entry) entry.betaal = checked ? 1 : 0;
        try {
            await apiUpdateField(id, 'betaal', checked ? 1 : 0);
            renderTable();
            renderQuoteHistory();
        } catch (e) {
            setStatus('Kon nie betaal status stoor nie: ' + e.message);
        }
    }

    async function toggleTrailer(id, checked) {
        const entry = currentRows.find(r => Number(r.id) === Number(id));
        if (entry) entry.trailer = checked ? 1 : 0;
        try {
            await apiUpdateField(id, 'trailer', checked ? 1 : 0);
        } catch (e) {
            setStatus('Kon nie trailer status stoor nie: ' + e.message);
        }
    }

    function syncHistoryEntry(id, field, value) {
        const entry = historyRows.find(r => Number(r.id) === Number(id));
        if (entry) {
            entry[field] = value;
        }
        renderQuoteHistory();
    }

    async function addRow() {
        const entry = blankEntry(dateForNewRow());
        try {
            const result = await apiCreateEntry(entry, currentType);
            entry.id = result.id;
            currentRows.push(entry);
            if (currentType === 'kwotasie') {
                historyRows.unshift({ ...entry });
                historyRows.sort((a, b) => {
                    const dateDiff = (b.datum || '').localeCompare(a.datum || '');
                    return dateDiff !== 0 ? dateDiff : (Number(b.id) || 0) - (Number(a.id) || 0);
                });
            }
            renderTable();
            renderDateFilterCalendar();
        } catch (e) {
            setStatus('Kon nie ry byvoeg nie: ' + e.message);
        }
    }

    async function deleteRow(id) {
        if (!confirm('Verwyder hierdie ry?')) return;
        try {
            await apiDelete(id);
            currentRows = currentRows.filter(r => r.id !== id);
            historyRows = historyRows.filter(r => Number(r.id) !== Number(id));
            renderTable();
        } catch (e) {
            setStatus('Kon nie verwyder nie: ' + e.message);
        }
    }

    async function moveToDagboek(id, checkbox) {
        const entry = currentRows.find(r => r.id === id);
        const today = new Date().toISOString().slice(0, 10);
        try {
            // First stamp the finalisation date, then move to dagboek
            await apiUpdateField(id, 'finaliseerDatum', today);
            const result = await apiAccept(id);
            currentRows = currentRows.filter(r => r.id !== id);
            historyRows = historyRows.filter(r => Number(r.id) !== Number(id));
            renderTable();
            const days = result && result.days_created;
            const daysMsg = days > 1 ? ` — ${days} dae geskep in Dagboek` : '';
            setStatus(`Verplaas na Dagboek${entry && entry.klientID ? ': ' + entry.klientID : ''} (${today})${daysMsg}`);
        } catch (e) {
            if (checkbox) checkbox.checked = false;
            setStatus('Kon nie verplaas nie: ' + e.message);
        }
    }

    function setStatus(msg) {
        const el = document.getElementById('statusMsg');
        el.textContent = msg;
        clearTimeout(setStatus._t);
        setStatus._t = setTimeout(() => { el.textContent = ''; }, 4500);
    }

    function escapeHtml(s) {
        return String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    }
    function escapeAttr(s) { return escapeHtml(s); }

    async function exportDagboek() {
        if (currentType !== 'dagboek') return;

        const btn = document.getElementById('exportBtn');
        const origText = btn.textContent;
        btn.disabled = true;
        btn.textContent = 'Besig…';

        try {
            const params = new URLSearchParams({
                year:  currentYear,
                month: currentMonthIdx + 1,   // monthIdx is 0-based
            });
            if (currentDayFilter) {
                params.set('day', currentDayFilter);
            }

            const response = await fetch(`/dagboek/export?${params}`);
            if (!response.ok) {
                const text = await response.text();
                throw new Error(`Server fout ${response.status}: ${text}`);
            }

            // Trigger browser download
            const blob = await response.blob();
            const url  = URL.createObjectURL(blob);
            const a    = document.createElement('a');
            const cd   = response.headers.get('content-disposition') || '';
            const fnMatch = cd.match(/filename="?([^"]+)"?/);
            a.download = fnMatch ? fnMatch[1] : 'DAGPROGRAM.xlsx';
            a.href = url;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);

        } catch (err) {
            alert('Eksport misluk: ' + err.message);
            console.error(err);
        } finally {
            btn.disabled = false;
            btn.textContent = origText;
        }
    }

    function updateExportBtn() {
        const btn = document.getElementById('exportBtn');
        if (btn) btn.style.display = currentType === 'dagboek' ? '' : 'none';
    }

    window.addEventListener('DOMContentLoaded', init);
</script>
</body>
</html>
